name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dev_zip_url:
        description: 'Direct URL of an extension .zip for a dev build (leave empty for the Web Store build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the same signing key every time, or Android refuses to install the APK over the previous one
      - name: Restore signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Secret KEYSTORE_BASE64 is missing (Settings > Secrets and variables > Actions)' }
          [IO.File]::WriteAllBytes("$PWD\debug.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      # assets/ext is not in the repo; the store build pulls the extension from the Web Store
      - name: Fetch extension from the Web Store
        if: ${{ inputs.dev_zip_url == '' }}
        shell: pwsh
        run: |
          $url = 'https://clients2.google.com/service/update2/crx?response=redirect&prodversion=120.0&acceptformat=crx2,crx3&x=id%3Dnldhifdlnmmkgngbnnmkoppinhafblbi%26uc'
          Invoke-WebRequest $url -OutFile $env:RUNNER_TEMP\ext.crx
          $b = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP\ext.crx")
          if ([Text.Encoding]::ASCII.GetString($b, 0, 4) -ne 'Cr24') { throw 'not a CRX file' }
          $start = 12 + [BitConverter]::ToUInt32($b, 8)   # CRX3: magic, version, header length, header, zip
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ext.zip", $b[$start..($b.Length - 1)])
          Expand-Archive "$env:RUNNER_TEMP\ext.zip" assets\ext -Force

      - name: Build (store)
        if: ${{ inputs.dev_zip_url == '' }}
        shell: pwsh
        run: ./build.ps1

      - name: Build (dev zip)
        if: ${{ inputs.dev_zip_url != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest '${{ inputs.dev_zip_url }}' -OutFile $env:RUNNER_TEMP\dev.zip
          ./build.ps1 -DevZip $env:RUNNER_TEMP\dev.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BetterClassroom-apk
          path: BetterClassroom*.apk
          if-no-files-found: error

      # tag = version.txt (v1.13, or v1.13-dev for a dev build); re-running replaces the APK
      - name: Publish release
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          $dev = '${{ inputs.dev_zip_url }}' -ne ''
          $tag = if ($dev) { "v$ver-dev" } else { "v$ver" }
          $apk = if ($dev) { 'BetterClassroom-dev.apk' } else { 'BetterClassroom.apk' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $apk --clobber
          } else {
              $flags = if ($dev) { @('--prerelease') } else { @() }
              gh release create $tag $apk --target ${{ github.sha }} --title "Better Classroom $tag" --notes "Built from ${{ github.sha }}" @flags
          }
          if ($LASTEXITCODE) { throw 'release failed' }
